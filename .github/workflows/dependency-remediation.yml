name: Dependency remediation

on:
  push:
    branches: [security/dependency-remediation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[dependency-remediation-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/dependency-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install baseline
        run: npm ci

      - name: Show latest compatible registry releases
        run: |
          echo 'fast-uri 3.x:'
          npm view 'fast-uri@3' version --json
          echo 'js-yaml 4.x:'
          npm view 'js-yaml@4' version --json
          echo 'brace-expansion 1.x:'
          npm view 'brace-expansion@1' version --json
          echo 'brace-expansion 2.x:'
          npm view 'brace-expansion@2' version --json

      - name: Refresh vulnerable transitive dependencies within declared ranges
        run: npm update fast-uri js-yaml brace-expansion --package-lock-only

      - name: Verify resolved dependency versions
        run: |
          npm ci
          npm ls fast-uri js-yaml brace-expansion --all
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entries = Object.entries(lock.packages ?? {})
            .filter(([path]) => /node_modules\/(fast-uri|js-yaml|brace-expansion)$/.test(path))
            .map(([path, meta]) => ({ path, version: meta.version }));
          console.log(JSON.stringify(entries, null, 2));

          function tuple(v) {
            return v.split('.').map(Number);
          }
          function gte(v, min) {
            const a = tuple(v), b = tuple(min);
            for (let i = 0; i < 3; i++) {
              if ((a[i] ?? 0) > (b[i] ?? 0)) return true;
              if ((a[i] ?? 0) < (b[i] ?? 0)) return false;
            }
            return true;
          }

          for (const { path, version } of entries) {
            const name = path.split('/').pop();
            const major = Number(version.split('.')[0]);
            let safe = true;
            if (name === 'fast-uri') {
              safe = (major === 2 && gte(version, '2.4.5')) ||
                     (major === 3 && gte(version, '3.1.6')) ||
                     (major === 4 && gte(version, '4.1.3'));
            } else if (name === 'js-yaml') {
              safe = (major === 3 && gte(version, '3.15.2')) ||
                     (major === 4 && gte(version, '4.3.2')) ||
                     (major >= 5 && gte(version, '5.4.1'));
            } else if (name === 'brace-expansion') {
              safe = (major === 1 && gte(version, '1.1.18')) ||
                     (major === 2 && gte(version, '2.1.4')) ||
                     (major === 3 && gte(version, '3.0.6')) ||
                     (major >= 5 && gte(version, '5.0.9'));
            }
            if (!safe) throw new Error(`Unsafe resolved version: ${path} -> ${version}`);
          }
          NODE

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests and coverage
        run: npm run test:coverage

      - name: Compute Pages base path
        id: basepath
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.basepath.outputs.base }}
        run: npm run build

      - name: Verify PWA assets and offline shell
        env:
          VITE_BASE_PATH: ${{ steps.basepath.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          if grep -q '__WB_MANIFEST' dist/sw.js; then
            echo 'Service worker precache manifest was not injected'
            exit 1
          fi
          grep -q 'index.html' dist/sw.js
          grep -q 'manifest.webmanifest' dist/sw.js
          grep -q 'nutritrack-nav' dist/sw.js
          grep -q 'nutritrack-off-api' dist/sw.js
          grep -q 'nutritrack-off-img' dist/sw.js
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/manifest.webmanifest', 'utf8'));
          const base = process.env.VITE_BASE_PATH;
          if (manifest.start_url !== base || manifest.scope !== base) {
            throw new Error(`Unexpected PWA scope: start_url=${manifest.start_url}, scope=${manifest.scope}, expected=${base}`);
          }
          NODE
          grep -l 'pwa-register' dist/assets/index-*.js > /dev/null
          ls dist/assets/virtual_pwa-register-*.js > /dev/null
          ls dist/assets/dashboard-*.js > /dev/null
          ls dist/assets/foods-*.js > /dev/null
          ls dist/assets/recipes-*.js > /dev/null
          ls dist/assets/settings-*.js > /dev/null
          ls dist/assets/stats.worker-*.js > /dev/null
          ls dist/assets/api-*.js > /dev/null
          echo 'PWA/offline build contract OK'

      - name: Commit lockfile only after all gates pass
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh patched transitive dependencies [dependency-remediation-complete]'
          git push origin HEAD:security/dependency-remediation
