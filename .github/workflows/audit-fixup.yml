name: Audit fixup

on:
  push:
    branches: [audit/structural-fixes]

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/structural-fixes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node scripts/apply-audit-fixups.mjs
      - run: npx prettier --write "src/**/*.{ts,css}" "test/**/*.ts" "*.{ts,js,json,md}"

      - name: Commit normalized changes when needed
        run: |
          if git diff --quiet; then
            echo "No fixups needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "test: align regression suite with audit invariants"
          git push origin HEAD:audit/structural-fixes
